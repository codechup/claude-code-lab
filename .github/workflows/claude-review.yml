name: Claude PR review

# The m13-02-github-actions-review lab: an automatic PR review with
# anthropics/claude-code-action@v1 (see its docs/solutions.md § Automatic PR Code Review).
#
# This workflow is intentionally harmless when ANTHROPIC_API_KEY isn't set (a public fork's
# claude-code-lab clone, or this repo before a maintainer adds the secret): the review step
# is skipped via a job-level env → step `if` guard instead of failing red. A pull_request
# from a fork never receives secrets on a public repo either way, so the guard also covers
# that case without extra logic.

# SECURITY INVARIANT — DO NOT CHANGE THIS TRIGGER.
# This workflow triggers on `pull_request`, never on `pull_request_target`.
#   - `pull_request` from a fork runs with NO access to repository secrets and a read-only
#     GITHUB_TOKEN, so a fork PR can never obtain ANTHROPIC_API_KEY, even though this
#     workflow checks out the PR's head commit (i.e. untrusted code).
#   - `pull_request_target` would run in the BASE repo's context with full secret access while
#     still checking out attacker-controlled code — that combination leaks the API key to
#     anyone who can open a PR. If a future change needs write access from a fork PR, use a
#     separate, secret-free workflow plus `workflow_run`; do not switch this trigger.
# The `if: env.ANTHROPIC_API_KEY != ''` guard below is the second half of the same invariant:
# with no secret the review step is skipped, so a fork PR (and this repo before a maintainer
# adds the secret) goes green instead of failing red. Keep both halves.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: claude-review
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # PINNING, DELIBERATELY ASYMMETRIC. Third-party actions in this repo are SHA-pinned
      # (see actions/checkout above): a mutable tag on someone else's action is a supply-chain
      # risk. `anthropics/claude-code-action` is referenced by its major tag `@v1` on purpose:
      # this workflow is the worked example for the m13-02 lab and for
      # `l3-advanced/m13-headless-ci/02-github-actions-review`, which teach `@v1` as the current
      # reference (and teach migrating off `@beta`); a SHA here would teach a version that rots
      # and would contradict the lesson a reader is following. The action is first-party to the
      # tool this course is about, and it carries no repository secret on a fork PR (see the
      # SECURITY INVARIANT above). A production repo that is not a teaching artifact should
      # SHA-pin this line too.
      - name: Run Claude Code review
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against this repo's own conventions (.claude/CLAUDE.md,
            BUGS.md): correctness, whether a bug fix kept its test, whether core logic still
            lives in src/store.ts rather than being duplicated in the CLI/API wrappers, and
            whether either TEACHING SURFACE comment in src/api/server.ts was touched without
            a matching BUGS.md update.

            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level feedback; only post GitHub comments, don't
            just print review text.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Skipped (no ANTHROPIC_API_KEY secret)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY is not set — skipping the Claude review step."
